title: "LambdaGuide"
description: "A step-by-step hyperspectral CLEM guide"
remote_theme: "just-the-docs/just-the-docs"
plugins:
  - jekyll-remote-theme
color_scheme: "light"

# Org root site → served at /
url: "https://lambdaguide.github.io"
baseurl: ""

# favicon_ico: "/imgs/00_favicon.ico"
# logo: "/imgs/00_logo.svg"

search_enabled: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

# Header link back to the family
aux_links:
  "TomoGuide":
    - "https://tomoguide.github.io/"
aux_links_new_tab: false

# "Edit this page on GitHub" footer links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/LambdaGuide/LambdaGuide.github.io"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
